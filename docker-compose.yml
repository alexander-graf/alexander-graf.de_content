services:
  astro:
    build: .
    container_name: alexander-graf-astro
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      # /zeichnung ausgenommen: faellt der Auth-Router unten aus (z.B. ZEICHNUNG_AUTH
      # fehlt), gibt es 404 statt einer ungeschuetzten Seite.
      - "traefik.http.routers.alex-astro.rule=(Host(`${DOMAIN}`) || Host(`alexander-graf.de`)) && !Path(`/zeichnung`) && !PathPrefix(`/zeichnung/`)"
      - "traefik.http.routers.alex-astro.entrypoints=websecure"
      - "traefik.http.routers.alex-astro.tls.certresolver=myresolver"
      - "traefik.http.middlewares.alex-redirect.redirectregex.regex=^https://alexander-graf\\.de/(.*)"
      - "traefik.http.middlewares.alex-redirect.redirectregex.replacement=https://alexandergraf.de/$$1"
      - "traefik.http.middlewares.alex-redirect.redirectregex.permanent=true"
      - "traefik.http.routers.alex-astro.middlewares=alex-redirect"
      - "traefik.http.services.alex-astro.loadbalancer.server.port=80"
      # Basic Auth fuer alles, was nur fuer Alex ist (/zeichnung, tools., draw.).
      # Der Hash (htpasswd -nbB) steht in der .env auf dem Server, nicht im Repo.
      # Faellt dieser Container aus, fehlt die Middleware und die geschuetzten
      # Router liefern 404 statt offener Seiten.
      - "traefik.http.middlewares.alex-privat-auth.basicauth.users=${ZEICHNUNG_AUTH}"
      - "traefik.http.routers.alex-zeichnung.rule=(Host(`${DOMAIN}`) || Host(`alexander-graf.de`)) && (Path(`/zeichnung`) || PathPrefix(`/zeichnung/`))"
      - "traefik.http.routers.alex-zeichnung.priority=100"
      - "traefik.http.routers.alex-zeichnung.entrypoints=websecure"
      - "traefik.http.routers.alex-zeichnung.tls.certresolver=myresolver"
      - "traefik.http.routers.alex-zeichnung.middlewares=alex-redirect,alex-privat-auth"
      - "traefik.http.routers.alex-zeichnung.service=alex-astro"

  # IT-Tools und draw.io: fertige Images, je eine eigene Subdomain (Wildcard-DNS
  # zeigt schon hierher). Unterpfade gehen nicht, beide laden von /assets bzw. /.
  it-tools:
    image: corentinth/it-tools:2024.10.22-7ca5933
    container_name: alexander-graf-it-tools
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.alex-it-tools.rule=Host(`tools.alexandergraf.de`)"
      - "traefik.http.routers.alex-it-tools.entrypoints=websecure"
      - "traefik.http.routers.alex-it-tools.tls.certresolver=myresolver"
      - "traefik.http.routers.alex-it-tools.middlewares=alex-privat-auth"
      - "traefik.http.services.alex-it-tools.loadbalancer.server.port=80"

  drawio:
    image: jgraph/drawio:32.2.0
    container_name: alexander-graf-drawio
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.alex-drawio.rule=Host(`draw.alexandergraf.de`)"
      - "traefik.http.routers.alex-drawio.entrypoints=websecure"
      - "traefik.http.routers.alex-drawio.tls.certresolver=myresolver"
      - "traefik.http.routers.alex-drawio.middlewares=alex-privat-auth"
      - "traefik.http.services.alex-drawio.loadbalancer.server.port=8080"

  cms-auth:
    build: ./oauth-proxy
    container_name: alexander-graf-cms-auth
    restart: unless-stopped
    environment:
      - OAUTH_CLIENT_ID=${GITHUB_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - ORIGIN=https://${DOMAIN}
      - PORT=3000
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.alex-cms-auth.rule=(Host(`${DOMAIN}`) || Host(`alexander-graf.de`)) && (PathPrefix(`/auth`) || PathPrefix(`/callback`))"
      - "traefik.http.routers.alex-cms-auth.entrypoints=websecure"
      - "traefik.http.routers.alex-cms-auth.tls.certresolver=myresolver"
      - "traefik.http.routers.alex-cms-auth.middlewares=alex-redirect"
      - "traefik.http.services.alex-cms-auth.loadbalancer.server.port=3000"

networks:
  proxy:
    external: true
